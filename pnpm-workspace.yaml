packages:
  - website

# Overrides de seguridad (pnpm 11+ los lee solo desde este archivo).
overrides:
  js-yaml: ^4.3.2
  undici: ^7.30.1
  http-cache-semantics: ^4.3.0
  smol-toml: ^1.9.0
  # Solo herramientas de build (electron-builder/knip), no viajan en la app.
  fast-uri: ^3.1.9
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=2 <3: ^2.1.7
  brace-expansion@>=4 <6: ^5.0.12
  zod: ^4.6.6

allowBuilds:
  electron: true
  ffmpeg-static: true
  electron-winstaller: false
  es5-ext: false
  puppeteer: false
  sleep: false

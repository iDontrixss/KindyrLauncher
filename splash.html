<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kindyr Launcher</title>
  <style>
    :root {
      --bg: #030f2b;
      --surface: #0a2559;
      --surface-2: #12408a;
      --blue: #4c8dff;
      --blue-soft: #aacdff;
      --accent: #ff5a3c;
      --ink: #010712;
      --text: #f4f8ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100%;
      height: 100%;
      padding: 20px;
      overflow: hidden;
      background:
        linear-gradient(rgba(76, 141, 255, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(76, 141, 255, .08) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
    }

    .splash::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 245px;
      height: 78px;
      right: -82px;
      top: 37px;
      border: 3px solid var(--ink);
      background: var(--accent);
      transform: rotate(-18deg);
    }

    .splash::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 135px;
      height: 135px;
      left: -47px;
      bottom: -55px;
      border: 3px solid var(--ink);
      background: var(--blue);
      transform: rotate(45deg);
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      align-self: start;
    }

    .brand-chip,
    .version {
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font: 900 10px/1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-chip { padding: 8px 10px; background: var(--surface); }
    .brand-chip b { color: var(--accent); margin-right: 6px; }
    .version { padding: 8px 9px; color: var(--ink); background: var(--blue-soft); }

    .center {
      align-self: center;
      display: flex;
      align-items: center;
      width: min(100%, 370px);
      gap: 20px;
      margin: -2px auto 0;
    }

    .logo-frame {
      position: relative;
      flex: 0 0 102px;
      width: 102px;
      height: 102px;
      display: grid;
      place-items: center;
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      background: var(--surface-2);
    }

    .logo-frame::before,
    .logo-frame::after {
      content: "";
      position: absolute;
      width: 19px;
      height: 19px;
      border: 2px solid var(--ink);
      background: var(--accent);
    }

    .logo-frame::before { top: -10px; right: -10px; }
    .logo-frame::after { bottom: -10px; left: -10px; background: var(--blue-soft); }

    .logo {
      position: relative;
      z-index: 1;
      width: 77px;
      height: 77px;
      object-fit: contain;
    }

    .logo-fallback {
      display: none;
      width: 64px;
      height: 64px;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      border: 3px solid var(--ink);
      background: var(--blue);
      font: 900 34px/1 Arial, sans-serif;
    }

    .logo-fallback.show { display: flex; }

    .copy { min-width: 0; }
    .eyebrow {
      color: var(--blue-soft);
      font: 800 10px/1.1 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .title {
      margin-top: 7px;
      color: var(--text);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: .92;
      text-transform: uppercase;
    }
    .title span { display: block; color: var(--accent); }
    .subtitle {
      margin-top: 10px;
      color: var(--blue-soft);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .bottom {
      align-self: end;
      width: min(100%, 370px);
      margin: 0 auto;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
      color: var(--blue-soft);
      font: 800 10px/1.2 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .status { min-height: 12px; transition: opacity .18s ease; }
    .status.fade { opacity: 0; }
    .phase { color: var(--accent); white-space: nowrap; }

    .progress-shell {
      height: 15px;
      padding: 3px;
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      background: var(--surface);
    }
    .progress {
      width: 26%;
      height: 100%;
      background: var(--accent);
      animation: loading 1.5s cubic-bezier(.2,.8,.2,1) infinite alternate;
    }
    @keyframes loading { from { width: 26%; } to { width: 92%; } }
  </style>
</head>
<body>
  <main class="splash">
    <div class="topline">
      <div class="brand-chip"><b>✦</b> Kindyr / Launcher</div>
      <div class="version" id="splash-version">v1.0.0</div>
    </div>

    <div class="center">
      <div class="logo-frame">
        <img class="logo" src="assets/logo-dark.png" alt="Kindyr" id="splash-logo">
        <div class="logo-fallback" id="splash-logo-fallback">K</div>
      </div>
      <div class="copy">
        <div class="eyebrow">Iniciando experiencia</div>
        <h1 class="title">Todo listo<br><span>para crear.</span></h1>
        <p class="subtitle">Tu próximo mundo está a punto de abrirse.</p>
      </div>
    </div>

    <div class="bottom">
      <div class="status-line"><span class="status" id="splash-status">Cargando interfaz...</span><span class="phase">01 / 01</span></div>
      <div class="progress-shell" aria-hidden="true"><div class="progress"></div></div>
    </div>
  </main>
  <script>
    const logo = document.getElementById('splash-logo')
    const fallback = document.getElementById('splash-logo-fallback')
    logo.onerror = () => { logo.style.display = 'none'; fallback.classList.add('show') }

    const version = new URLSearchParams(location.search).get('v')
    if (version) document.getElementById('splash-version').textContent = 'v' + version

    const messages = ['Cargando interfaz...', 'Preparando instancias...', 'Comprobando ajustes...', 'Casi listo...']
    let index = 0
    const statusEl = document.getElementById('splash-status')
    setInterval(() => {
      statusEl.classList.add('fade')
      setTimeout(() => {
        index = (index + 1) % messages.length
        statusEl.textContent = messages[index]
        statusEl.classList.remove('fade')
      }, 180)
    }, 1150)
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bienvenido a Zotlin Launcher</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-app-region: drag; }
    .header { padding: 20px 24px 0; display: flex; justify-content: flex-end; -webkit-app-region: drag; }
    .win-close { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; border: none; cursor: pointer; -webkit-app-region: no-drag; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; -webkit-app-region: no-drag; }
    .logo { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
    .step { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; }
    .step.active { display: flex; }
    .step-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    p { font-size: 13px; color: #888; line-height: 1.6; max-width: 320px; margin-bottom: 28px; }
    .options { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    .option-btn { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #242424; border: 1.5px solid #333; border-radius: 10px; cursor: pointer; text-align: left; transition: border-color 0.15s; width: 100%; }
    .option-btn:hover { border-color: #1D9E75; }
    .option-btn.selected { border-color: #1D9E75; background: #1a2e27; }
    .option-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .option-icon.ms { background: #1a2f4a; color: #2F6FD4; }
    .option-icon.offline { background: #1a3d30; color: #1D9E75; }
    .option-icon.lang { background: #2a2a1a; color: #f0c040; }
    .option-icon.theme { background: #1a1a2e; color: #7c7cf0; }
    .option-text strong { display: block; font-size: 14px; font-weight: 600; color: #fff; }
    .option-text span { font-size: 12px; color: #666; }
    .username-input { width: 100%; max-width: 320px; padding: 12px 16px; background: #242424; border: 1.5px solid #333; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.15s; }
    .username-input:focus { border-color: #1D9E75; }
    .footer { padding: 20px 24px 28px; display: flex; justify-content: space-between; align-items: center; -webkit-app-region: no-drag; }
    .dots { display: flex; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #333; transition: background 0.2s; }
    .dot.active { background: #1D9E75; }
    .btn-next { background: #1D9E75; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .btn-next:hover { opacity: 0.88; }
    .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-back { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; padding: 10px; }
    .btn-back:hover { color: #fff; }
  </style>
</head>
<body>

<div class="header">
  <button class="win-close" onclick="window.electronAPI.send('close')"></button>
</div>

<div class="content">
  <img class="logo" src="assets/logo-dark.png" alt="Zotlin">

  <!-- Paso 1: Cuenta -->
  <div class="step active" id="step-1">
    <div class="step-label">Paso 1 de 3</div>
    <h1>Bienvenido a Zotlin</h1>
    <p>¿Con qué tipo de cuenta querés jugar?</p>
    <div class="options">
      <button class="option-btn" id="opt-ms" onclick="selectAccount('microsoft')">
        <div class="option-icon ms"><i class="fa-brands fa-microsoft"></i></div>
        <div class="option-text">
          <strong>Cuenta Microsoft</strong>
          <span>Login oficial · Servidores premium</span>
        </div>
      </button>
      <button class="option-btn" id="opt-offline" onclick="selectAccount('offline')">
        <div class="option-icon offline"><i class="fa-solid fa-user"></i></div>
        <div class="option-text">
          <strong>Modo offline</strong>
          <span>Sin cuenta · Solo servidores sin verificación</span>
        </div>
      </button>
    </div>
    <div id="offline-name-wrap" style="display:none;margin-top:14px;width:100%;max-width:320px;">
      <input class="username-input" id="offline-name" placeholder="Tu nombre de jugador" maxlength="16">
    </div>
  </div>

  <!-- Paso 2: Idioma -->
  <div class="step" id="step-2">
    <div class="step-label">Paso 2 de 3</div>
    <h1>Elegí tu idioma</h1>
    <p>Podés cambiarlo en cualquier momento desde ajustes.</p>
    <div class="options">
      <button class="option-btn" id="opt-es" onclick="selectLang('es')">
        <div class="option-icon lang">🇪🇸</div>
        <div class="option-text">
          <strong>Español</strong>
          <span>Interfaz en español</span>
        </div>
      </button>
      <button class="option-btn" id="opt-en" onclick="selectLang('en')">
        <div class="option-icon lang">🇬🇧</div>
        <div class="option-text">
          <strong>English</strong>
          <span>Interface in English</span>
        </div>
      </button>
    </div>
  </div>

  <!-- Paso 3: Tema -->
  <div class="step" id="step-3">
    <div class="step-label">Paso 3 de 3</div>
    <h1>Elegí tu tema</h1>
    <p>Podés cambiarlo en cualquier momento desde ajustes.</p>
    <div class="options">
      <button class="option-btn" id="opt-dark" onclick="selectTheme('dark')">
        <div class="option-icon theme"><i class="fa-solid fa-moon"></i></div>
        <div class="option-text">
          <strong>Oscuro</strong>
          <span>El clásico, suave para la vista</span>
        </div>
      </button>
      <button class="option-btn" id="opt-light" onclick="selectTheme('light')">
        <div class="option-icon" style="background:#f0f0e0;color:#888;"><i class="fa-solid fa-sun"></i></div>
        <div class="option-text">
          <strong>Claro</strong>
          <span>Limpio y minimalista</span>
        </div>
      </button>
      <button class="option-btn" id="opt-green" onclick="selectTheme('green')">
        <div class="option-icon" style="background:#1a3d30;color:#1D9E75;"><i class="fa-solid fa-leaf"></i></div>
        <div class="option-text">
          <strong>Verde</strong>
          <span>Estilo natural</span>
        </div>
      </button>
    </div>
  </div>
</div>

<div class="footer">
  <button class="btn-back" id="btn-back" onclick="goBack()" style="visibility:hidden">← Atrás</button>
  <div class="dots">
    <div class="dot active" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
  </div>
  <button class="btn-next" id="btn-next" onclick="console.log('click'); goNext()">Siguiente →</button>
</div>

<script>
  let currentStep = 1
  let config = { accountType: null, language: null, theme: null, username: '' }

  const i18n = {
    es: {
      step3Label: 'Paso 3 de 3',
      step3Title: 'Elegí tu tema',
      step3Desc: 'Podés cambiarlo en cualquier momento desde ajustes.',
      themeDark: 'Oscuro', themeDarkDesc: 'El clásico, suave para la vista',
      themeLight: 'Claro', themeLightDesc: 'Limpio y minimalista',
      themeGreen: 'Verde', themeGreenDesc: 'Estilo natural',
      next: 'Siguiente →', finish: '¡Empezar! →', back: '← Atrás',
      openingMs: 'Abriendo Microsoft...', retry: 'Reintentar →'
    },
    en: {
      step3Label: 'Step 3 of 3',
      step3Title: 'Choose your theme',
      step3Desc: 'You can change it anytime from settings.',
      themeDark: 'Dark', themeDarkDesc: 'Classic, easy on the eyes',
      themeLight: 'Light', themeLightDesc: 'Clean and minimal',
      themeGreen: 'Green', themeGreenDesc: 'Natural style',
      next: 'Next →', finish: "Let's go! →", back: '← Back',
      openingMs: 'Opening Microsoft...', retry: 'Retry →'
    }
  }

  function t(key) {
    return (i18n[config.language] || i18n.es)[key]
  }

  function applyLang() {
    document.querySelector('#step-3 .step-label').textContent = t('step3Label')
    document.querySelector('#step-3 h1').textContent = t('step3Title')
    document.querySelector('#step-3 p').textContent = t('step3Desc')
    document.querySelector('#opt-dark .option-text strong').textContent = t('themeDark')
    document.querySelector('#opt-dark .option-text span').textContent = t('themeDarkDesc')
    document.querySelector('#opt-light .option-text strong').textContent = t('themeLight')
    document.querySelector('#opt-light .option-text span').textContent = t('themeLightDesc')
    document.querySelector('#opt-green .option-text strong').textContent = t('themeGreen')
    document.querySelector('#opt-green .option-text span').textContent = t('themeGreenDesc')
    document.getElementById('btn-back').textContent = t('back')
    document.getElementById('btn-next').textContent = currentStep === 3 ? t('finish') : t('next')
  }

  function selectAccount(type) {
    config.accountType = type
    document.getElementById('opt-ms').classList.toggle('selected', type === 'microsoft')
    document.getElementById('opt-offline').classList.toggle('selected', type === 'offline')
    document.getElementById('offline-name-wrap').style.display = type === 'offline' ? 'block' : 'none'
    updateNextBtn()
  }

  function selectLang(lang) {
    config.language = lang
    document.getElementById('opt-es').classList.toggle('selected', lang === 'es')
    document.getElementById('opt-en').classList.toggle('selected', lang === 'en')
    applyLang()
    updateNextBtn()
  }

  function selectTheme(theme) {
    config.theme = theme
    document.getElementById('opt-dark').classList.toggle('selected', theme === 'dark')
    document.getElementById('opt-light').classList.toggle('selected', theme === 'light')
    document.getElementById('opt-green').classList.toggle('selected', theme === 'green')
    updateNextBtn()
  }

  function updateNextBtn() {
    const btn = document.getElementById('btn-next')
    if (currentStep === 1) btn.disabled = !config.accountType
    if (currentStep === 2) btn.disabled = !config.language
    if (currentStep === 3) btn.disabled = !config.theme
  }

  function goNext() {
    if (currentStep === 1 && config.accountType === 'microsoft') {
      const btn = document.getElementById('btn-next')
      btn.disabled = true
      btn.textContent = t('openingMs')
      window.electronAPI.invoke('ms-login').then(result => {
        btn.disabled = false
        btn.textContent = t('next')
        if (result.ok) {
          config.username = result.account.name
          config.accountType = 'microsoft'
          nextStep()
        } else {
          btn.textContent = t('retry')
        }
      })
      return
    }
    if (currentStep === 1 && config.accountType === 'offline') {
      const name = document.getElementById('offline-name').value.trim()
      if (!name || name.length < 3) {
        document.getElementById('offline-name').style.borderColor = '#c0392b'
        return
      }
      config.username = name
    }
    if (currentStep === 3) {
      finishOnboarding()
      return
    }
    nextStep()
  }

  function nextStep() {
    document.getElementById('step-' + currentStep).classList.remove('active')
    document.getElementById('dot-' + currentStep).classList.remove('active')
    currentStep++
    document.getElementById('step-' + currentStep).classList.add('active')
    document.getElementById('dot-' + currentStep).classList.add('active')
    document.getElementById('btn-back').style.visibility = currentStep > 1 ? 'visible' : 'hidden'
    document.getElementById('btn-next').textContent = currentStep === 3 ? t('finish') : t('next')
    updateNextBtn()
  }

  function goBack() {
    document.getElementById('step-' + currentStep).classList.remove('active')
    document.getElementById('dot-' + currentStep).classList.remove('active')
    currentStep--
    document.getElementById('step-' + currentStep).classList.add('active')
    document.getElementById('dot-' + currentStep).classList.add('active')
    document.getElementById('btn-back').style.visibility = currentStep > 1 ? 'visible' : 'hidden'
    document.getElementById('btn-next').textContent = t('next')
    updateNextBtn()
  }

  async function finishOnboarding() {
    const result = await window.electronAPI.invoke('finish-onboarding', config)
    if (!result.ok) console.error('Error finishing onboarding')
  }
</script>

</body>
</html>

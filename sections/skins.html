<style>
  /* Kindyr tokens — STYLE_GUIDE.md: radius 0, 2-3px ink, hard shadow */
  .skins-root {
    display: grid;
    grid-template-columns: 258px 1fr;
    gap: 14px;
    height: 100%;
    overflow: hidden;
    align-items: start;
  }
  @media (max-width: 900px) {
    .skins-root { grid-template-columns: 1fr; overflow-y: auto; }
  }

  /* LEFT — Selector Modrinth-like */
  .skin-viewer-panel {
    width: 258px;
    min-width: 258px;
    background: var(--kindyr-surface, #0a2559);
    border: 3px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 4px 4px 0 var(--kindyr-ink, #010712);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 14px;
    gap: 10px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .skins-root .skin-viewer-panel { position: sticky; top: 0; }
  .viewer-kicker {
    font-family: 'Space Grotesk','Segoe UI',system-ui,sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--kindyr-blue-soft, #aacdff);
    display:flex; align-items:center; gap:8px;
  }
  .viewer-kicker i { color: var(--kindyr-accent, #ff5a3c); }
  .skin-viewer-wrap {
    width: 100%;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--kindyr-bg, #030f2b);
    /* checker 16px — STYLE_GUIDE skins checker */
    background-image:
      linear-gradient(45deg, #0e336f 25%, transparent 25%),
      linear-gradient(-45deg, #0e336f 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #0e336f 75%),
      linear-gradient(-45deg, transparent 75%, #0e336f 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 3px 3px 0 var(--kindyr-ink, #010712), inset 0 2px 0 rgba(255,255,255,0.04);
    position: relative;
    overflow: hidden;
  }
  .skin-viewer-wrap::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: radial-gradient(ellipse at 50% 100%, rgba(76,141,255,.18) 0%, transparent 72%);
    pointer-events: none;
  }
  #skin-canvas { width: 100% !important; height: 100% !important; display: block; }
  #skin-preview-img {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    object-fit: contain;
    display: none;
  }
  .skin-viewer-name {
    display: inline-flex;
    align-self: center;
    align-items: center;
    justify-content: center;
    min-height: 22px;
    padding: 2px 8px;
    background: var(--kindyr-surface-2, #12408a);
    border: 2px solid var(--kindyr-ink, #010712);
    box-shadow: 2px 2px 0 var(--kindyr-ink, #010712);
    font-family: 'JetBrains Mono',monospace;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: var(--kindyr-text, #f4f8ff);
    text-align: center;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .skin-viewer-badge {
    font-family: 'JetBrains Mono',monospace;
    font-size: 9px;
    font-weight: 700;
    color: var(--kindyr-blue-soft, #79b0ff);
    text-transform: uppercase;
    letter-spacing: .08em;
    text-align: center;
    margin-top: -2px;
  }
  .drag-hint {
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--kindyr-blue-soft, #aacdff);
    opacity: .9;
  }
  .skin-model-toggle {
    display: flex;
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    overflow: hidden;
    width: 100%;
    box-shadow: 2px 2px 0 var(--kindyr-ink, #010712);
  }
  .model-btn {
    flex: 1;
    padding: 7px 0;
    background: var(--kindyr-surface-2, #12408a);
    border: none;
    border-right: 2px solid var(--kindyr-ink, #010712);
    color: var(--kindyr-blue-soft, #aacdff);
    font-size: 11px;
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-weight: 800;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .model-btn:last-child { border-right: none; }
  .model-btn.active { background: var(--kindyr-accent, #ff5a3c); color: var(--kindyr-ink, #010712); }
  .model-btn:not(.active):hover { background: var(--kindyr-surface, #0a2559); color: var(--kindyr-text, #f4f8ff); }

  .skin-actions {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
  }
  .skin-action-btn {
    width: 100%;
    min-height: 36px;
    padding: 9px 12px;
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    font-size: 12px;
    font-weight: 800;
    font-family: 'Space Grotesk',system-ui,sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    box-shadow: 3px 3px 0 var(--kindyr-ink, #010712);
    transition: transform .1s, filter .12s;
  }
  .skin-action-btn:active { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--kindyr-ink, #010712); }
  .skin-action-btn.primary { background: var(--kindyr-accent, #ff5a3c); color: var(--kindyr-ink, #010712); }
  .skin-action-btn.primary:hover { filter: brightness(1.08); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--kindyr-ink, #010712); }
  .skin-action-btn.primary:disabled { opacity: .45; cursor: not-allowed; transform:none; box-shadow:3px 3px 0 var(--kindyr-ink); }
  .skin-action-btn.secondary { background: var(--kindyr-surface-2, #12408a); color: var(--kindyr-text, #f4f8ff); }
  .skin-action-btn.secondary:hover { filter: brightness(1.08); transform: translate(-1px,-1px); }
  .skin-action-btn.ghost { background: transparent; color: var(--kindyr-blue-soft, #aacdff); border-color: #1e3a8a; box-shadow: none; }
  .skin-action-btn.ghost:hover { border-color: var(--kindyr-blue, #4c8dff); color: var(--kindyr-text); background: rgba(76,141,255,.08); }

  .skin-divider { width: 100%; height: 2px; background: var(--kindyr-ink, #010712); opacity:.35; margin: 2px 0; }
  .sv-status {
    font-family: 'JetBrains Mono',monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--kindyr-blue-soft, #79b0ff);
    text-align: center;
    line-height: 1.5;
    padding: 0 4px;
    min-height: 14px;
  }
  .sv-status.ok { color: #1bd96a; }
  .sv-status.error { color: #ff5a3c; }

  /* RIGHT — Gallery Modrinth-like, Kindyr tokens */
  .skin-gallery-panel {
    flex: 1;
    background: var(--kindyr-surface, #0a2559);
    border: 3px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 4px 4px 0 var(--kindyr-ink, #010712);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .skin-gallery-top {
    padding: 12px 14px 0;
    border-bottom: 2px solid var(--kindyr-ink, #010712);
    background: var(--kindyr-surface-2, #12408a);
  }
  .skin-tabs {
    display: flex;
    gap: 8px;
  }
  .skin-tab {
    padding: 7px 12px;
    background: var(--kindyr-surface, #0a2559);
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 2px 2px 0 var(--kindyr-ink, #010712);
    color: var(--kindyr-blue-soft, #aacdff);
    font-size: 11px;
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-weight: 800;
    letter-spacing: .03em;
    cursor: pointer;
    transition: transform .08s, filter .12s;
    margin-bottom: -2px;
  }
  .skin-tab:hover { filter: brightness(1.08); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--kindyr-ink); color: var(--kindyr-text); }
  .skin-tab.active { background: var(--kindyr-accent, #ff5a3c); color: var(--kindyr-ink, #010712); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--kindyr-ink); }

  .skin-search-bar {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 2px solid var(--kindyr-ink, #010712);
    background: var(--kindyr-bg, #030f2b);
  }
  .skin-search-input {
    flex: 1;
    height: 38px;
    background: #071c45;
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 2px 2px 0 var(--kindyr-ink, #010712);
    color: var(--kindyr-text, #f4f8ff);
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 9px 12px;
    outline: none;
  }
  .skin-search-input:focus { border-color: var(--kindyr-blue, #4c8dff); }
  .skin-search-input::placeholder { color: #6f9de8; }
  .skin-search-btn {
    min-height: 38px;
    padding: 9px 16px;
    background: var(--kindyr-blue, #4c8dff);
    color: var(--kindyr-ink, #010712);
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 2px 2px 0 var(--kindyr-ink, #010712);
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .08s, filter .12s;
    white-space: nowrap;
  }
  .skin-search-btn:hover { filter: brightness(1.08); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--kindyr-ink); }

  .skin-gallery-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    background: var(--kindyr-bg, #030f2b);
  }
  .skin-section-head {
    display:flex; align-items:center; gap:8px;
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--kindyr-text, #f4f8ff);
    margin: 6px 0 10px;
    cursor: pointer;
    user-select:none;
  }
  .skin-section-head i { color: var(--kindyr-accent, #ff5a3c); font-size:10px; transition: transform .15s; }
  .skin-section-head.collapsed i { transform: rotate(-90deg); }
  .skin-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 1200px){ .skin-grid{grid-template-columns: repeat(4, 1fr);} }
  @media (max-width: 800px){ .skin-grid{grid-template-columns: repeat(3, 1fr);} }
  .skin-card {
    background: var(--kindyr-surface-2, #12408a);
    border: 2px solid var(--kindyr-ink, #010712);
    border-radius: 0;
    box-shadow: 3px 3px 0 var(--kindyr-ink, #010712);
    padding: 10px 8px 8px;
    cursor: pointer;
    transition: transform .08s, filter .12s, border-color .12s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    position: relative;
    min-height: 146px;
  }
  .skin-card:hover {
    border-color: var(--kindyr-blue, #4c8dff);
    transform: translate(-1px,-1px);
    box-shadow: 4px 4px 0 var(--kindyr-ink, #010712);
    filter: brightness(1.04);
  }
  .skin-card.selected {
    border-color: var(--kindyr-accent, #ff5a3c);
    background: var(--kindyr-surface, #0a2559);
    box-shadow: 3px 3px 0 var(--kindyr-accent, #ff5a3c);
  }
  .skin-card.equipped { border-color: #1bd96a; }
  .skin-card.add-card {
    border: 2px dashed #255cb7;
    background: transparent;
    box-shadow: none;
    justify-content: center;
    gap: 8px;
    min-height: 146px;
  }
  .skin-card.add-card:hover { background: rgba(76,141,255,.08); border-color: var(--kindyr-blue, #4c8dff); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--kindyr-ink); }
  .skin-card-avatar {
    width: 92px;
    height: 92px;
    image-rendering: pixelated;
    object-fit: contain;
    display:block;
  }
  /* body images taller — keep contain */
  .skin-card .skin-card-avatar[src*="/body/"] { height: 110px; width: 68px; }
  .skin-card-name {
    font-family: 'Space Grotesk',system-ui,sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--kindyr-text, #f4f8ff);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .skin-card-fav {
    position: absolute;
    top: 6px; right: 6px;
    width: 22px; height: 22px;
    background: var(--kindyr-bg, #030f2b);
    border: 2px solid var(--kindyr-ink, #010712);
    box-shadow: 2px 2px 0 var(--kindyr-ink);
    color: #5b6b95;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: color .12s, background .12s;
  }
  .skin-card-fav:hover, .skin-card-fav.active { color: #ffcc33; background: #0a2559; }
  .skin-check {
    position: absolute;
    top: 6px; right: 6px;
    width: 18px; height: 18px;
    background: var(--kindyr-accent, #ff5a3c);
    border: 2px solid var(--kindyr-ink);
    color: var(--kindyr-ink);
    font-size: 10px;
    display:flex; align-items:center; justify-content:center;
  }
  .skin-upload-zone {
    border: 2px dashed #255cb7;
    border-radius: 0;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    background: transparent;
    box-shadow: 3px 3px 0 transparent;
  }
  .skin-upload-zone:hover, .skin-upload-zone.drag {
    border-color: var(--kindyr-blue, #4c8dff);
    background: rgba(76,141,255,.08);
  }
  .skin-upload-icon { font-size: 24px; margin-bottom: 8px; opacity: .7; color: var(--kindyr-blue-soft); }
  .skin-upload-text { font-size: 12px; color: var(--kindyr-blue-soft); line-height: 1.6; font-weight:600; }
  .skin-upload-text strong { color: var(--kindyr-text); font-weight:800; }
  .skin-empty {
    text-align: center;
    padding: 28px 16px;
    color: var(--kindyr-blue-soft, #79b0ff);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.7;
    border: 2px dashed #255cb7;
    background: rgba(76,141,255,.06);
  }
  .skin-loading {
    text-align: center;
    padding: 18px;
    color: var(--kindyr-blue-soft);
    font-family: 'JetBrains Mono',monospace;
    font-size: 11px;
    font-weight: 700;
    animation: skPulse 1.2s ease-in-out infinite;
  }
  @keyframes skPulse { 0%,100%{opacity:.35}50%{opacity:1} }
  #skin-file-input { display: none; }
</style>

<div class="page-head skins-page-head">
  <div>
    <div class="page-kicker"><i class="fa-solid fa-shirt"></i> <span data-i18n="skins.kicker">IDENTIDAD DEL JUGADOR</span></div>
    <div class="page-title" data-i18n="skins.title">Skins</div>
    <div class="page-subtitle" data-i18n="skins.subtitle">Buscá, previsualizá y guardá tu próxima apariencia.</div>
  </div>
</div>

<div class="skins-root" id="skins-view">

  <div class="skin-viewer-panel">
    <div class="viewer-kicker"><i class="fa-solid fa-shirt"></i> Selector de skin</div>
    <div class="skin-viewer-name" id="sv-name">Cargando...</div>
    <div class="skin-viewer-badge" id="sv-badge">SELECCIONÁ UNA SKIN</div>
    <div class="skin-viewer-wrap">
      <canvas id="skin-canvas" width="160" height="230"></canvas>
      <img id="skin-preview-img" src="" alt="Skin preview" style="display:none;">
    </div>
    <div class="drag-hint"><i class="fa-solid fa-arrows-left-right"></i> Drag to rotate</div>
    <button class="skin-action-btn ghost" style="align-self:center; width:auto; padding:6px 14px; min-height:28px; font-size:11px;" data-click="editCurrentSkin"><i class="fa-solid fa-pen-to-square"></i> Editar skin</button>

    <div class="skin-model-toggle">
      <button class="model-btn active" id="model-classic" data-click="setModel" data-args="[&quot;classic&quot;]">Classic</button>
      <button class="model-btn" id="model-slim" data-click="setModel" data-args="[&quot;slim&quot;]">Slim</button>
    </div>

    <div class="skin-actions">
      <button class="skin-action-btn primary" id="btn-apply" data-click="applySkin">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span data-i18n="skins.apply">Aplicar skin</span>
      </button>
      <button class="skin-action-btn secondary" data-click="openTab" data-args="[&quot;subir&quot;]">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span data-i18n="skins.upload">Subir skin</span>
      </button>
      <button class="skin-action-btn ghost" data-click="favCurrentSkin">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span data-i18n="skins.saveFavorite">Guardar favorita</span>
      </button>
    </div>

    <div class="skin-divider"></div>
    <div class="sv-status" id="sv-status" data-i18n="skins.selectSkin">Seleccioná una skin para comenzar</div>
  </div>

  <div class="skin-gallery-panel">
    <div class="skin-gallery-top">
      <div class="skin-tabs">
        <button class="skin-tab active" data-click="openTab" data-args="[&quot;populares&quot;,&quot;$this&quot;]" data-i18n="skins.popular">Populares</button>
        <button class="skin-tab" data-click="openTab" data-args="[&quot;favoritas&quot;,&quot;$this&quot;]" data-i18n="skins.favorites">Favoritas</button>
        <button class="skin-tab" data-click="openTab" data-args="[&quot;subir&quot;,&quot;$this&quot;]" data-i18n="skins.uploadTab">Subir</button>
      </div>
    </div>

    <div class="skin-search-bar" id="search-bar">
      <input class="skin-search-input" id="skin-search" placeholder="Buscar skin por usuario de Minecraft..." data-keydown="searchSkin" data-key="Enter">
      <button class="skin-search-btn" data-click="searchSkin">Buscar</button>
    </div>

    <div class="skin-gallery-body" id="gallery-body"></div>
  </div>
</div>

<input type="file" id="skin-file-input" accept=".png" data-change="handleFileUpload" data-args="[&quot;$event&quot;]">

<script src="sections/skins.js"></script>
